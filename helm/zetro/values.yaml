global:
  docker:
    # Artifactory host used for download Docker images
    artifactoryUrl: "zelytra"
    # Set in Gitlab-ci at the deployment. See values in CI/CD gitlab variables
    user: ""
    password: ""
    imageTag:
      zetroFrontend: latest
      zetroBackend: latest

  config:
    PLATFORM: dv1

postgresql:
  enabled: true
  auth:
    username: zetro
    database: ZetroPortfolio
    existingSecret: "zetro-db-secret"
  primary:
    # Observed on zelytra.fr: ~4m CPU / ~32Mi for this tiny DB (100Mi volume).
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    persistence:
      enabled: true
      storageClass: "local-path"
      size: 100Mi