---
## zetro-frontend image version
##

deployment:
  image:
    repository: /zetro-frontend
    pullPolicy: Always
  replicas: 1
  securityContext:
    enabled: true
  rolling:
    maxSurge: "25%"
    maxUnavailable: "25%"
  resources:
    # Static nginx serving the SPA: observed ~1m CPU / ~5Mi on zelytra.fr.
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

service:
  port: 80
  targetPort: 8080

github: "ZeTro-dev/portfolio"
backendURL: "/api"

ingress:
  prefix: ""
  suffix: ""

config:
  LOGGER_NAME: zetro-frontend-logger
